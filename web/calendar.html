<!doctype html>
<html lang="zh-CN" data-theme="{{theme}}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校历生成器</title><meta name="description" content="离线制作教学日历，设置教学周、考试与假期，导出 Excel 和日历数据。">
  {{styles}}
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5M17 3v5M3 11h18M7 15h3M14 15h3M7 18h3"/></svg></span><span>校历生成器</span></h1>
    <div class="top-actions"><button id="open-config">打开配置</button><button id="save-config">保存配置</button><button class="primary" id="export-xlsx">导出 Excel <span aria-hidden="true">↗</span></button></div>
    <input id="file-input" type="file" accept=".json,application/json" hidden>
  </header>
  <main class="workspace">
    <section class="preview" aria-label="校历预览">
      <div class="preview-heading"><div><h2 id="calendar-title" tabindex="-1"></h2><p id="calendar-subtitle"></p></div><div class="preview-actions"><button id="new-calendar">新建校历</button><button id="continue-edit" hidden>继续编辑</button><button id="undo" disabled title="撤销上一次修改">↶ 撤销</button><details id="more-tools" class="more-tools"><summary>更多</summary><div class="tools-popover"><button id="fit-view" class="text-button">紧凑显示</button><button id="export-json" class="text-button">导出日历数据</button></div></details></div></div>
      <div class="canvas">
        <div class="mode-banner" id="mode-banner"><span id="mode-message">点击日期查看详情。</span><button id="exit-mode" class="text-button" hidden>清除本次选择</button></div>
        <div class="calendar-frame">
          <div id="calendar-container" class="calendar-scroll" tabindex="0" aria-label="日历，可横向滚动"></div>
          <span class="calendar-edge calendar-edge-left" aria-hidden="true" hidden></span>
          <span class="calendar-edge calendar-edge-right" aria-hidden="true" hidden></span>
        </div>
        <div id="adjustment-preview" class="adjustment-preview" aria-live="polite" hidden></div>
        <div id="day-detail" class="day-detail" hidden></div>
        <div class="legend calendar-legend" aria-label="图例"><span><i class="legend-exam"></i>考 · 考试</span><span><i class="legend-vacation"></i>寒暑假</span><span><i class="legend-holiday"></i>休 · 放假</span><span>调 · 对调　补 · 补课</span><span id="range-legend" hidden><i class="legend-range"></i>待应用范围</span></div>
        <details id="school-source-details" class="foldout school-notes" hidden><summary id="school-source-label">学校说明</summary><div class="school-note-content"><p id="school-origin"></p><ul id="school-notice-list"></ul><p id="school-source" class="import-source"></p></div></details>
      </div>
    </section>
    <section id="settings" class="settings" aria-label="校历设置">
      <section class="step" aria-labelledby="step-year-title"><h2 id="step-year-title" tabindex="-1"><span>1 / 7</span> 新建校历</h2>
        <div class="step-fields">
          <div><label for="year">学年</label><div class="year-field"><input id="year" type="number" min="1900" max="2198" value="2026"><span id="year-suffix">— 2027 学年</span></div></div>
          <div><label for="half">学期</label><select id="half"><option value="autumn">秋冬学期</option><option value="spring">春夏学期</option></select></div>
        </div>
        <div class="creation-actions"><button id="import-school-start" class="primary">导入浙大校历</button><button id="manual-start">自行制表</button></div>
        <p id="school-import-status" class="creation-status" role="status" hidden></p>
        <div id="school-import-feedback" class="creation-feedback" hidden><button id="use-saved-school" class="text-button" hidden>使用已保存校历</button></div>
        <button id="cancel-new" class="text-button return-calendar" hidden>返回当前校历</button>
      </section>
      <section class="step" aria-labelledby="step-range-title" hidden><h2 id="step-range-title" tabindex="-1"><span>2 / 7</span> 制表范围</h2>
        <p class="calculated" id="selected-range"></p>
        <div class="step-actions"><button class="text-button" id="full-range">选择全部空白日期</button></div>
      </section>
      <section class="step" aria-labelledby="step-monday-title" hidden><h2 id="step-monday-title" tabindex="-1"><span>3 / 7</span> 第一教学周</h2>
        <p class="calculated" id="teaching-summary"></p>
      </section>
      <section class="step" aria-labelledby="step-first-title" hidden><h2 id="step-first-title" tabindex="-1"><span>4 / 7</span> <b id="first-exam-title">秋学期考试</b></h2>
        <div class="step-actions"><span id="first-exam-count">0 天</span></div>
        <div id="first-exam-list" class="exam-list"></div>
      </section>
      <section class="step" aria-labelledby="step-second-title" hidden><h2 id="step-second-title" tabindex="-1"><span>5 / 7</span> <b id="second-exam-title">冬学期考试</b></h2>
        <p id="second-exam-selection" class="calculated" aria-live="polite"></p>
        <div class="step-actions"><button class="text-button" id="clear-second">清除考试日期</button></div>
      </section>
      <section class="step" aria-labelledby="step-holidays-title" hidden><h2 id="step-holidays-title" tabindex="-1"><span>6 / 7</span> 放假日期</h2>
        <div id="holiday-presets" class="holiday-presets" role="group" aria-label="选择预设节日"></div>
        <p id="holiday-shared" class="hint" hidden></p>
        <div id="holiday-name-field" class="step-fields"><div><label for="holiday-name">放假名称</label><input id="holiday-name" maxlength="80" placeholder="填写其他放假名称"></div></div>
        <p id="holiday-empty" class="hint" aria-live="polite">已选 0 天</p>
        <details id="holiday-dates" class="foldout date-foldout" hidden><summary id="holiday-selection" aria-live="polite"></summary><div id="holiday-date-list" class="exam-list" aria-label="已选放假日期"></div></details>
        <div class="step-actions"><button id="save-holiday" class="primary">保存假期</button><button id="skip-holiday" class="text-button">暂时跳过</button><button id="custom-holiday" class="text-button">其他放假</button><button id="cancel-holiday" class="text-button" hidden>取消编辑</button></div>
        <details id="holiday-records" class="foldout records-foldout" hidden><summary id="holiday-record-count"></summary><div id="holiday-list" class="arrangement-list"></div></details>
      </section>
      <section class="step" aria-labelledby="step-adjustments-title" hidden><h2 id="step-adjustments-title" tabindex="-1"><span>7 / 7</span> 课程对调与补课</h2>
        <div id="adjustment-kind" class="adjustment-options" role="group" aria-label="调整方式"><button type="button" data-adjustment-kind="swap" aria-pressed="true">课程对调</button><button type="button" data-adjustment-kind="makeup" aria-pressed="false">补课</button></div>
        <p id="adjustment-hint" class="hint" hidden></p>
        <div class="step-actions"><button id="save-adjustment" class="primary">添加调课</button><button id="clear-adjustment" class="text-button" hidden>清除选择</button><button id="cancel-adjustment" class="text-button" hidden>取消编辑</button></div>
        <details id="adjustment-records" class="foldout records-foldout" hidden><summary id="adjustment-record-count"></summary><div id="adjustment-list" class="arrangement-list"></div></details>
      </section>
      <nav class="step-navigation" aria-label="切换设置步骤"><button id="previous-step" disabled>上一步</button><button id="next-step" class="primary">下一步：制表范围</button></nav>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>请使用支持 JavaScript 的浏览器打开本文件。</noscript>
  {{scripts}}
</body>
</html>
