<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校历 · 选择风格</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#292b2d;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1240px;margin:auto;padding:44px 36px 48px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfded9;padding-bottom:20px;margin-bottom:36px;gap:16px}header strong{font-size:15px;font-weight:600}a{color:inherit;text-underline-offset:4px}h1{font-size:32px;letter-spacing:-.04em;font-weight:600;line-height:1.4;margin:0 0 12px}.intro{color:#656862;margin:0 0 28px;max-width:750px}.options{display:grid;grid-template-columns:1fr 1fr;gap:24px}.option{border:1px solid #e2e0da;border-radius:20px;overflow:hidden;background:#fffefa}.option.mist{background:#fff;border-color:#e1e5eb}.preview{display:block;background:#f4f2ec;padding:18px;border-bottom:1px solid #e9e7e1}.mist .preview{background:#f3f5f8;border-color:#e7ebf0}.preview img{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 2px 12px #252a3610}.content{padding:25px 27px}.name{display:flex;align-items:center;gap:10px}h2{font-size:24px;margin:0;font-weight:550}.paper h2{font-family:Georgia,SimSun,serif}.description{color:#666960;font-size:13px;margin:12px 0 21px;min-height:44px}.swatches{display:flex;gap:6px;margin-bottom:24px}.swatches i{height:18px;width:32px;border-radius:5px;border:1px solid #0000000b}.actions{display:flex;align-items:center;gap:20px}.open{display:inline-block;text-decoration:none;background:#914d35;color:white;border-radius:9px;padding:9px 16px;font-size:13px;line-height:18px;min-height:36px}.mist .open{background:#0667cf;border-radius:12px}a:focus-visible{outline:2px solid #875139;outline-offset:4px}@media(max-width:760px){main{padding:24px 18px}.options{grid-template-columns:1fr}h1{font-size:27px}header{align-items:flex-start;margin-bottom:28px}.content{padding:22px}.description{min-height:0}}
</style>
</head>
<body>
<main>
<header>
<strong>校历生成器</strong>
</header>
<h1>选择风格</h1>
<p class="intro">功能相同，均可离线使用。</p>
<section class="options" aria-label="两套视觉方案">
<article class="option paper">
<a class="preview" href="paper.html" aria-label="打开暖纸版">
<img src="assets/paper.jpg" alt="暖纸版校历预览">
</a>
<div class="content">
<div class="name">
<h2>暖纸</h2>
</div>
<p class="description">暖白底色，衬线标题，陶土色点缀。</p>
<div class="swatches" aria-label="暖纸配色">
<i style="background:#f5f3ed">
</i>
<i style="background:#fffefa">
</i>
<i style="background:#302e29">
</i>
<i style="background:#914d35">
</i>
<i style="background:#edf2e8">
</i>
</div>
<div class="actions">
<a class="open" href="paper.html">打开暖纸版</a>
</div>
</div>
</article>
<article class="option mist">
<a class="preview" href="mist.html" aria-label="打开清透版">
<img src="assets/mist.jpg" alt="清透版校历预览">
</a>
<div class="content">
<div class="name">
<h2>清透</h2>
</div>
<p class="description">冷白底色，无衬线标题，蓝色点缀。</p>
<div class="swatches" aria-label="清透配色">
<i style="background:#f5f6f8">
</i>
<i style="background:#fff">
</i>
<i style="background:#1d232d">
</i>
<i style="background:#0667cf">
</i>
<i style="background:#edf6ef">
</i>
</div>
<div class="actions">
<a class="open" href="mist.html">打开清透版</a>
</div>
</div>
</article>
</section>
</main>
</body>
</html>
