name: 发布校历

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 读取源码
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 验证规则与交互
        run: node --test
      - name: 同步学校校历
        id: school
        run: node scripts/sync-calendars.js
      - name: 保存新增或更新的校历
        if: steps.school.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/zju-calendars.json
          if ! git diff --cached --quiet; then
            git commit -m '同步学校校历数据'
            git push
          fi
      - name: 构建双主题静态页面
        run: node scripts/build.js
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 保存站点产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 发布网站
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
